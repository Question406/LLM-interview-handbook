<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">RAG：检索、授权与有依据回答</title><desc id="desc">核心数据流示意；完整权限和故障语义见题目正文。</desc>
